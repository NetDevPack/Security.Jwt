version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      tests:
        patterns: ["xunit*", "AwesomeAssertions"]
    ignore:
      # Microsoft.* follow the target framework (net10 -> 10.0.x); only patch bumps are safe
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types: ["version-update:semver-major"]
      # Never reintroduce FluentAssertions (commercial license since v8), see docs/Dependencies/Known-Issues.md
      - dependency-name: "FluentAssertions"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
