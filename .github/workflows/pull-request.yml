name: NetDevPack - MASTER PR

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Check vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          # IdentityServer4 is EOL with known advisories and is accepted on purpose (docs/Decisions/ADR-002)
          ! grep -E '^\s+>' vulnerable.txt | grep -v ' IdentityServer4 '
